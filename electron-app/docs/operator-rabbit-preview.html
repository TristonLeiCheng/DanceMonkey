<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>话务员兔子 · DanceMonkey</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eef3f1;color:#243f39;font:14px -apple-system,BlinkMacSystemFont,sans-serif}h1{margin:0 0 5px;font-size:26px}p{margin:6px 0 18px;color:#526e66}.grid{display:grid;grid-template-columns:repeat(9,minmax(80px,1fr));gap:10px}.card{border-radius:14px;background:#fff;text-align:center;overflow:hidden;padding:8px}.card.dark{background:#203630;color:#fff}canvas{display:block;margin:auto;width:100%;height:auto}.label{font-size:12px;margin:5px}.poses{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.sizes{display:flex;align-items:end;gap:24px;padding:18px;background:#fff;border-radius:14px;margin:18px 0}h2{font-size:17px;margin:18px 0 10px}</style>
<h1>话务员兔子</h1><p>原创耳麦办公伙伴 · 36 个真实 PNG 动作帧 · 独立新增外形，保留原宠物</p>
<div class="sizes" id="sizes"></div><h2>九组动画 · 浅色背景</h2><div class="grid" id="light"></div><h2>九组动画 · 深色背景</h2><div class="grid" id="dark"></div><h2>完整动作帧 · 耳尖、麦克风、尾巴及笔记完整性检查</h2><div class="grid" id="frames"></div>
<script src="../src/pet-operator-atlas.js"></script><script>
const m=DMPetOperatorAtlas['operator-rabbit'], names=['待机','右行','左行','招手','开心','失落','倾听待命','耳麦通话','记录笔记'];
const image=new Image(), animated=[];
function draw(c,row,frame){const ctx=c.getContext('2d'),[x,y,w,h,dx,dy]=m.frames[row][frame];ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingQuality='high';ctx.drawImage(image,x,y,w,h,dx/256*c.width,dy/256*c.height,w/256*c.width,h/256*c.height)}
image.onload=()=>{for(const id of ['light','dark','frames'])for(let row=0;row<9;row++){const card=document.createElement('div');card.className='card'+(id==='dark'?' dark':'');card.innerHTML='<div class="label">'+names[row]+'</div>';if(id==='frames'){const poses=document.createElement('div');poses.className='poses';for(let f=0;f<4;f++){const c=document.createElement('canvas');c.width=c.height=256;poses.append(c);draw(c,row,f)}card.append(poses)}else{const c=document.createElement('canvas');c.width=c.height=256;card.append(c);animated.push([c,row]);draw(c,row,0)}document.getElementById(id).append(card)}for(const size of [48,68,96,128]){const wrap=document.createElement('div'),c=document.createElement('canvas');c.width=c.height=size*2;c.style.width=c.style.height=size+'px';wrap.append(c);const label=document.createElement('div');label.className='label';label.textContent=size+' px';wrap.append(label);sizes.append(wrap);draw(c,0,0)}window.previewReady=true;setInterval(()=>{for(const[c,row]of animated)draw(c,row,Math.floor(performance.now()/250)%4)},250)};image.src='../'+m.source;
</script></html>
