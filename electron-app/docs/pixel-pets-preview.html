<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素伙伴 · 新外形预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#3c4340;font:14px/1.6 system-ui,sans-serif;padding:32px 28px}main{max-width:1120px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#7c8678}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:8px 0 12px}p{color:#7b8178;margin:0}.counter{padding:7px 14px;border:1px solid #d4dbcb;border-radius:24px;white-space:nowrap;color:#607156;background:#edf0e6}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}button,select{font:inherit;color:inherit;border:1px solid #d8dcd1;border-radius:9px;padding:7px 12px;background:#fffdf8;cursor:pointer}button[aria-pressed=true]{color:#fff;background:#4d6557;border-color:#4d6557}button:focus-visible,select:focus-visible{outline:3px solid #a1b89a;outline-offset:2px}.options{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px}.options label{display:flex;align-items:center;gap:8px;margin-right:auto}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}article{border-radius:17px;border:1px solid #d8ddcf;overflow:hidden;background:#fffdf8}.stage{height:154px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#fffefa,#e6eade)}.dark .stage{background:#29383a}.stage canvas{image-rendering:pixelated;max-width:100%;object-fit:contain}.info{padding:11px 14px 14px}h2{font-size:15px;margin:0 0 3px}.info p{font-size:11px}footer{display:flex;justify-content:space-between;gap:16px;margin-top:20px;font-size:12px;color:#7d8579}.tag{font-size:10px;color:#77856f;margin-left:8px;font-weight:400}@media(max-width:820px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){body{padding:24px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.counter{display:inline-block;margin-top:12px}h1{font-size:26px}footer{display:block}}
</style>
<main>
<header><div><div class="eyebrow">DANCEMONKEY · PIXEL COMPANIONS</div><h1>小小像素，有了新表情。</h1><p>圆润轮廓、柔和配色，和陪伴你的小动作。</p></div><span class="counter" id="edition">10 位伙伴 · 新版外形</span></header>
<div class="toolbar" role="group" aria-label="预览状态"></div>
<div class="options"><label>显示大小<select id="size" aria-label="显示大小"><option value="48">48 px</option><option value="68">68 px</option><option value="96" selected>96 px</option><option value="128">128 px</option></select></label><button id="version" aria-pressed="false">查看优化前</button><button id="pause" aria-pressed="false">暂停动画</button><button id="background" aria-pressed="false">深色背景</button></div>
<section class="cards" aria-label="像素宠物预览"></section>
<footer><span>在“软件设置 → 桌面宠物 → 像素伙伴”选择并保存后使用。</span><span>本页仅预览，不修改当前宠物与设置。</span></footer>
</main>
<script src="../src/pet-sprites.js"></script>
<script>
const pets=[['human','小人','蓬松刘海 · 软蓝色小毛衣'],['rabbit','兔子','粉粉长耳 · 奶油色小肚皮'],['fox','狐狸','尖尖耳朵 · 蓬松奶油尾尖'],['goose','大鹅','圆圆翅膀 · 摇摆小脚蹼'],['cockroach','蟑螂','栗色小甲壳 · 晃晃触角'],['mosquito','蚊子','透亮小翅膀 · 轻盈悬停'],['frog','青蛙','薄荷绿小脸 · 笑眯眯'],['penguin','企鹅','奶油围兜 · 摇摆小鳍'],['turtle','乌龟','拼花小龟壳 · 慢慢探头'],['hedgehog','刺猬','栗色小刺 · 软软的脸颊']];
const moods={normal:'待机',happy:'开心',bored:'发呆',sleepy:'打盹',eating:'吃饭',working:'工作',reading:'阅读',exercising:'运动',relaxing:'喝茶'};
const cards=[],toolbar=document.querySelector('.toolbar'),motion=matchMedia('(prefers-reduced-motion: reduce)'),legacy=new Image();
let mood='normal',old=false,paused=false,elapsed=0,previous=performance.now(),lastKey='',size=96;
legacy.onload=()=>draw();legacy.src='assets/pixel-pets-before.png';
for(const [key,label] of Object.entries(moods)){
 const b=document.createElement('button');b.textContent=label;b.dataset.mood=key;b.setAttribute('aria-pressed',String(key===mood));
 b.onclick=()=>{mood=key;elapsed=0;for(const child of toolbar.children)child.setAttribute('aria-pressed',String(child===b));draw()};toolbar.append(b);
}
for(const [id,name,description] of pets){
 const card=document.createElement('article');card.dataset.animal=id;
 card.innerHTML=`<div class="stage"><canvas width="32" height="32" aria-label="${name}动作"></canvas></div><div class="info"><h2>${name}<span class="tag">像素伙伴</span></h2><p>${description}</p></div>`;
 document.querySelector('.cards').append(card);const canvas=card.querySelector('canvas');cards.push({id,canvas,ctx:canvas.getContext('2d')});
}
function draw(){
 const frame=motion.matches?0:old?Math.floor(elapsed/420)%4:DMPetSprites.frameAt(elapsed),row=Object.keys(moods).indexOf(mood);
 for(const [i,c] of cards.entries()){
  c.canvas.style.width=c.canvas.style.height=size+'px';c.canvas.dataset.frame=String(frame);c.ctx.clearRect(0,0,32,32);c.ctx.imageSmoothingEnabled=false;
  if(old){if(legacy.complete&&legacy.naturalWidth)c.ctx.drawImage(legacy,(i*4+frame)*32,row*32,32,32,0,0,32,32)}
  else c.ctx.putImageData(new ImageData(DMPetSprites.render(c.id,mood,frame),32,32),0,0);
 }
}
document.getElementById('size').onchange=function(){size=Number(this.value);draw()};
document.getElementById('version').onclick=function(){old=!old;this.textContent=old?'查看优化后':'查看优化前';this.setAttribute('aria-pressed',String(old));document.getElementById('edition').textContent=old?'10 位伙伴 · 原版外形':'10 位伙伴 · 新版外形';draw()};
document.getElementById('pause').onclick=function(){paused=!paused;this.textContent=paused?'播放动画':'暂停动画';this.setAttribute('aria-pressed',String(paused))};
document.getElementById('background').onclick=function(){const dark=document.body.classList.toggle('dark');this.textContent=dark?'浅色背景':'深色背景';this.setAttribute('aria-pressed',String(dark))};
motion.addEventListener('change',draw);
function tick(time){
 if(!paused&&!document.hidden&&!motion.matches)elapsed+=Math.min(time-previous,100);previous=time;
 const frame=motion.matches?0:old?Math.floor(elapsed/420)%4:DMPetSprites.frameAt(elapsed),key=[old,mood,frame,size].join('/');
 if(!document.hidden&&key!==lastKey){lastKey=key;draw()}requestAnimationFrame(tick);
}
draw();requestAnimationFrame(tick);
</script>
</html>
