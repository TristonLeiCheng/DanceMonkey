<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>框选截图</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        background: #000;
        user-select: none;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hint {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(16, 17, 20, 0.78);
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .toolbar {
        position: fixed;
        z-index: 3;
        display: none;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
        background: rgba(16, 17, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .toolbar button {
        height: 30px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
      }
      .toolbar button.primary {
        background: rgba(190, 161, 111, 0.28);
        color: #f3e2bd;
      }
      .toolbar button:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <div class="hint">拖拽选择区域 · Enter 完成 · Esc 取消</div>
    <canvas id="board"></canvas>
    <div class="toolbar" id="toolbar">
      <button class="primary" data-act="done">完成截图</button>
      <button data-act="ai">AI 分析</button>
      <button data-act="cancel">取消</button>
    </div>
    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const toolbar = document.getElementById("toolbar");
      const api = window.regionCapture;
      let image = new Image();
      let start = null;
      let current = null;
      let dragging = false;

      function cssRect() {
        if (!start || !current) return null;
        const x = Math.min(start.x, current.x);
        const y = Math.min(start.y, current.y);
        const width = Math.abs(current.x - start.x);
        const height = Math.abs(current.y - start.y);
        if (width < 2 || height < 2) return null;
        return { x, y, width, height };
      }

      function paint() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(image, 0, 0, w, h);
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, w, h);
        const rect = cssRect();
        if (!rect) return;
        ctx.clearRect(rect.x, rect.y, rect.width, rect.height);
        ctx.drawImage(image, rect.x, rect.y, rect.width, rect.height, rect.x, rect.y, rect.width, rect.height);
        ctx.strokeStyle = "rgba(190,161,111,0.95)";
        ctx.lineWidth = 2;
        ctx.strokeRect(rect.x + 1, rect.y + 1, rect.width - 2, rect.height - 2);
        placeToolbar(rect);
      }

      function placeToolbar(rect) {
        toolbar.style.display = "flex";
        const left = Math.min(window.innerWidth - 280, Math.max(12, rect.x));
        const top = Math.min(window.innerHeight - 48, rect.y + rect.height + 10);
        toolbar.style.left = `${left}px`;
        toolbar.style.top = `${Math.max(12, top)}px`;
      }

      function finish(action) {
        const rect = cssRect();
        if (!rect && action !== "cancel") return;
        api.submit({ action, rect });
      }

      window.addEventListener("mousedown", (event) => {
        if (event.target.closest(".toolbar")) return;
        dragging = true;
        start = { x: event.clientX, y: event.clientY };
        current = { ...start };
        toolbar.style.display = "none";
        paint();
      });
      window.addEventListener("mousemove", (event) => {
        if (!dragging) return;
        current = { x: event.clientX, y: event.clientY };
        paint();
      });
      window.addEventListener("mouseup", () => {
        dragging = false;
        paint();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") finish("cancel");
        if (event.key === "Enter") finish("done");
      });
      toolbar.addEventListener("click", (event) => {
        const act = event.target.closest("[data-act]")?.dataset.act;
        if (act) finish(act);
      });

      api.onImage((dataUrl) => {
        image.onload = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          paint();
        };
        image.src = dataUrl;
      });
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        paint();
      });
    </script>
  </body>
</html>
