<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图完成</title>
    <style>
      :root {
        color-scheme: dark;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #bea16f;
        --accent-bg: rgba(190, 161, 111, 0.2);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--text);
        font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .frame {
        height: calc(100% - 16px);
        margin: 8px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(16, 17, 20, 0.94);
        backdrop-filter: blur(22px);
        display: grid;
        grid-template-columns: 150px 1fr;
        overflow: hidden;
      }
      .preview {
        background: #0d0e11;
        border-right: 1px solid var(--line);
        display: grid;
        place-items: center;
        padding: 10px;
      }
      .preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 6px;
      }
      .panel {
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font: 500 18px/1.2 Palatino Linotype, Palatino, KaiTi, serif;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        height: 36px;
        border: 0;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: var(--accent-bg);
        color: var(--accent);
      }
      button:hover { filter: brightness(1.08); }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="preview"><img id="preview" alt="预览" /></div>
      <div class="panel">
        <h1>截图已完成</h1>
        <p>已复制到剪贴板。接下来要？</p>
        <p id="name"></p>
        <div class="actions">
          <button class="primary" data-act="edit">进入截图编辑</button>
          <button data-act="continue">继续截图</button>
          <div class="row">
            <button data-act="close">完成</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      const api = window.screenshotChoice;
      api.onInit((payload) => {
        document.getElementById("preview").src = payload.fileUrl || payload.dataUrl || "";
        document.getElementById("name").textContent = payload.fileName || "";
      });
      document.body.addEventListener("click", (event) => {
        const act = event.target.closest("[data-act]")?.dataset.act;
        if (!act) return;
        api.choose(act);
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") api.choose("close");
        if (event.key === "Enter") api.choose("edit");
      });
    </script>
  </body>
</html>
